[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uristt"
version = "0.1.0"
description = "stt:// and tts:// URI capability packs for urisys-node"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "urisys contributors" }, { name = "Tom Sapletta", email = "tom@sapletta.com" }]
keywords = ["uri", "urisys", "uristt", "stt", "tts"]
dependencies = ["uricontrol>=0.1.8"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "uricontrol>=0.1.8"]

[tool.uv.sources]
uricontrol = { path = "../uricontrol", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["uristt*"]

[tool.setuptools.package-data]
uristt = ["manifest.yaml", "manifest.tts.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
